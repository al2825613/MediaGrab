workflows:
  android-kotlin-workflow:
    name: MediaGrab CI
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - keystore_credentials 
      vars:
        PACKAGE_NAME: "com.example.mediagrab"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
    scripts:
      - name: Set up JDK 17
        script: |
          echo "Setting up JDK 17..."
          jenv global 17
          java -version

      - name: Make gradlew executable
        script: chmod +x ./gradlew

      - name: Build debug APK
        script: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (Unsigned)
        script: ./gradlew :app:assembleRelease --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk
